name: Sync to Gitee

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror to Gitee
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git clone --mirror "https://github.com/${{ github.repository }}.git" repo.git
          git --git-dir=repo.git push --mirror "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/advance100/refine.git"